      --ivory-muted: #E8E2D0;

      --gold-deep: #C29A45;
      --text-navy: #F5F1E6;

      background: var(--gold-deep);
      color: var(--navy-0);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .tablist {

      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .kpi-value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;

      border-top: 1px solid var(--ivory-muted);

      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;

      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 12px;

      color: var(--text-ivory);
      border-radius: 10px;

      grid-template-columns: 300px 1fr;
      align-items: stretch;
    }
    .gantt-left {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--ivory);
      padding: 8px 12px 8px 0;
      border-right: 1px solid var(--ivory-muted);
    }
    .gantt-track {
      position: relative;
      height: 56px;
    }
    .gantt-gridline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(12, 27, 48, 0.08);
      pointer-events: none;
    }
    .gantt-miles .gantt-track { height: 42px; }

    .today-line {

      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--red);
      z-index: 3;
      pointer-events: none;
    }
    .today-label {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      white-space: nowrap;

    .gantt-bar {

      height: 28px;
      border: 0;
      padding: 0;

      font: inherit;

    .diamond {

      width: 12px;
      height: 12px;

      border: 2px solid var(--gold-deep);

    .chart-box { position: relative; height: 260px; }

</head>

    function parseDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
    }
    function formatDate(iso) {
      return parseDate(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    }
    function formatInt(n) { return Math.round(n).toLocaleString("en-US"); }
    function formatPct(ratio) {
      if (!isFinite(ratio) || ratio === 0) return "0%";
      const p = Math.round(ratio * 1000) / 10;
      return Number.isInteger(p) ? p + "%" : p.toFixed(1) + "%";
    }
    function daysBetween(a, b) {
      return Math.round((parseDate(b) - parseDate(a)) / 86400000);

    function waveMeta(id) { return DATA.waves.find((w) => w.id === id); }
    function pillFg(bg) { return NAVY_ON.has(bg.toUpperCase()) ? "#0C1B30" : "#F5F1E6"; }
    function pill(label, bg) {
      return `<span class="pill" style="background:${bg};color:${pillFg(bg)}">${esc(label)}</span>`;
    }
    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function cohortTotal(c) {

    function sumBy(arr, fn) { return arr.reduce((n, x) => n + fn(x), 0); }
    function waveCohorts(waveId) { return DATA.cohorts.filter((c) => c.wave === waveId); }
    function wavePopulation(waveId) { return sumBy(waveCohorts(waveId), cohortTotal); }
    function waveOnNexus(waveId) { return sumBy(waveCohorts(waveId), cohortOnNexus); }
    function waveBlocked(waveId) { return sumBy(waveCohorts(waveId), (c) => c.blocked); }
    function waveRag(wave) {
      const pct = waveOnNexus(wave.id) / wavePopulation(wave.id);
      if (wave.status === "Complete") return "green";
      if (wave.status === "In Progress") {
        if (pct >= 0.60) return "green";
        if (pct >= 0.25) return "amber";
        return "red";
      }
      return wave.start > DATA.meta.today ? "green" : "amber";
    }
    function appOnNexus(a) { return a.status === "Cut Over" || a.status === "Verified"; }
    function readinessRag(item) {
      if (item.percent >= item.target) return "green";
      if (item.percent >= item.target - 15) return "amber";
      return "red";
    }
    function hexToRgb(hex) {
      const n = hex.replace("#", "");
      return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
    }
    function tint(hex, pct) {
      const [r, g, b] = hexToRgb(hex);
      return `rgba(${r},${g},${b},${(0.08 + pct * 0.32).toFixed(3)})`;
    }
    function windowSpan() { return daysBetween(DATA.meta.windowStart, DATA.meta.windowEnd); }
    function posPct(iso) { return (daysBetween(DATA.meta.windowStart, iso) / windowSpan()) * 100; }
    function widthPct(start, end) {
      return ((daysBetween(start, end)) / windowSpan()) * 100;

          ${kpiCard(formatInt(legacy), "LegacyID decommissioned", "Accounts disabled on LegacyID")}
        </div>
        <p class="legend">On Nexus = Migrated + Verified + Legacy disabled. A wave is Complete only when exit criteria are met. <span class="mono">blocked</span> is an overlay (subset of not-yet-cut-over identities), not a seventh funnel stage.</p>
        <p class="health"><strong>Program health.</strong> Wave 0 is complete. Wave 1 is ${w1pct} on Nexus with contingent MFA fallout. Wave 2 is in dual-run at ${w2pct}. ${formatInt(blocked)} identities are blocked. Wave 3 (privileged) is gated on session recording.</p>
        <div class="card">
          <h2>Program progress · identities on Nexus</h2>
          <div class="progress-track" style="height:14px"><div class="progress-fill" style="width:${(on / total) * 100}%"></div></div>
          <p class="muted" style="margin:8px 0 0;font-size:12px">${formatInt(on)} of ${formatInt(total)} identities</p>
          ${waveRows}
        </div>`;
    }

    function monthAxis() {
      const monthStarts = [
        { label: "Jun", date: "2026-06-01" },
        { label: "Jul", date: "2026-07-01" },
        { label: "Aug", date: "2026-08-01" },
        { label: "Sep", date: "2026-09-01" },
        { label: "Oct", date: "2026-10-01" },
        { label: "Nov", date: "2026-11-01" },
        { label: "Dec", date: "2026-12-01" }
      ];
      const headers = monthStarts.map((m, i) => {
        const left = posPct(m.date);
        const next = monthStarts[i + 1];
        const width = next ? posPct(next.date) - left : 100 - left;
        return `<span style="left:${left}%;width:${width}%">${m.label}</span>`;
      }).join("");
      const lines = monthStarts.slice(1).map((m) =>
        `<div class="gantt-gridline" style="left:${posPct(m.date)}%"></div>`
      ).join("");
      return { headers, lines };
    }

    function renderWaves() {
      const todayLeft = posPct(DATA.meta.today);
      const axis = monthAxis();
      const miles = DATA.milestones.map((m) =>
        `<button type="button" class="diamond${m.status === "Complete" ? " complete" : ""}" style="left:${posPct(m.date)}%" data-kind="milestone" data-id="${m.id}" title="${esc(m.name)}" aria-label="${esc(m.name)}, ${formatDate(m.date)}, ${m.status}"></button>`
      ).join("");
      const rows = DATA.waves.map((w) => {
        const pop = wavePopulation(w.id);
        const n = waveOnNexus(w.id);
        const left = posPct(w.start);
        const width = widthPct(w.start, w.end);
        const done = pop ? (n / pop) * 100 : 0;
        return `<div class="gantt-row">
          <div class="gantt-left">
            <div class="wave-name"><span class="dot" style="background:${w.color}"></span>${esc(w.name)}</div>
            <div class="wave-aud">${esc(w.audience)}</div>
            <div class="muted" style="font-size:11px">${formatInt(pop)} identities</div>
          </div>
          <div class="gantt-track">
            ${axis.lines}
            <div class="today-line" style="left:${todayLeft}%"></div>
            <button type="button" class="gantt-bar" data-kind="wave" data-id="${w.id}" style="left:${left}%;width:${width}%;background:${w.color}" aria-label="${esc(w.name)}, ${formatDate(w.start)} to ${formatDate(w.end)}, ${w.status}">
              <span class="done" style="width:${done}%"></span>
            </button>
          </div>
        </div>`;
      }).join("");

      document.getElementById("panel-waves").innerHTML = `
        <div class="gantt-wrap">
          <div class="gantt">
            <div class="gantt-head">
              <div class="gantt-left muted" style="font-size:11px;font-weight:700">WAVE / MILESTONES</div>
              <div>
                <div class="month-row">${axis.headers}<div class="today-label" style="left:${todayLeft}%">Today</div></div>
                <div class="gantt-track" style="height:8px">${axis.lines}<div class="today-line" style="left:${todayLeft}%"></div></div>
              </div>
            </div>
            <div class="gantt-miles">
              <div class="gantt-left muted" style="font-size:12px">Gates &amp; decommission</div>
              <div class="gantt-track">${axis.lines}${miles}<div class="today-line" style="left:${todayLeft}%"></div></div>
            </div>
            ${rows}
          </div>
        </div>`;

      document.getElementById("panel-waves").querySelectorAll("[data-kind]").forEach((el) => {
        el.addEventListener("click", () => {
          if (el.dataset.kind === "wave") openWave(el.dataset.id);
          else openMilestone(el.dataset.id);
        });
      });
    }

    function openWave(id) {
      const w = waveMeta(id);
      const pop = wavePopulation(id);
      const on = waveOnNexus(id);
      const blocked = waveBlocked(id);
      const rag = waveRag(w);
      const examples = w.examples.map((e) => `<li><strong>${esc(e.name)}</strong> — ${esc(e.role)} · ${esc(e.status)}</li>`).join("");
      openPopover(`
        <h3 id="popover-title"><span class="dot" style="background:${w.color}"></span>${esc(w.name)}</h3>
        <p class="muted">${esc(w.audience)}</p>
        <p>${formatDate(w.start)} – ${formatDate(w.end)} · ${pill(w.status, WAVE_STATUS_COLOR[w.status])} ${pill(rag, RAG_COLOR[rag])}</p>
        <p>${esc(w.definition)}</p>
        <p><strong>Identities.</strong> ${formatInt(on)} / ${formatInt(pop)} on Nexus (${formatPct(on / pop)})${blocked ? ` · <span class="blocked">${formatInt(blocked)} blocked</span>` : ""}</p>
        <h4>Entry criteria</h4>
        <ul>${w.entryCriteria.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
        <h4>Exit criteria</h4>
        <ul>${w.exitCriteria.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
        <h4>Example identities</h4>
        <ul>${examples}</ul>
      `);
    }

    function openMilestone(id) {
      const m = DATA.milestones.find((x) => x.id === id);
      openPopover(`
        <h3 id="popover-title">${esc(m.name)}</h3>
        <p>${formatDate(m.date)} · ${pill(m.status, MILESTONE_STATUS_COLOR[m.status])}</p>
      `);
    }

    function openCohort(id) {
      const c = DATA.cohorts.find((x) => x.id === id);
      const w = waveMeta(c.wave);
      const pop = cohortTotal(c);
      openPopover(`
        <h3 id="popover-title">${esc(c.id)}</h3>
        <p>${esc(c.department)} · ${esc(c.region)} · ${pill(c.criticality, CRITICALITY_COLOR[c.criticality])} ${pill(c.privilege, PRIVILEGE_COLOR[c.privilege])}</p>
        <p>${pill(w.shortName, w.color)}</p>
        <p><strong>${formatInt(cohortOnNexus(c))}</strong> / ${formatInt(pop)} on Nexus (${formatPct(cohortOnNexus(c) / pop)})${c.blocked ? ` · <span class="blocked">${formatInt(c.blocked)} blocked</span>` : ""}</p>
        <p class="mono muted">NS ${c.notStarted} / R ${c.ready} / S ${c.scheduled} / M ${c.migrated} / V ${c.verified} / LD ${c.legacyDisabled}</p>
      `);
    }

    let funnelChart, appChart, burnChart;

    function renderIdentities() {
      const total = sumBy(DATA.cohorts, cohortTotal);
      const stageCards = FUNNEL_STAGES.map((s) => {
        const n = sumBy(DATA.cohorts, (c) => c[s.key]);
        return `<article class="card kpi"><div class="kpi-value" style="font-size:24px">${formatInt(n)}</div><div class="kpi-label">${esc(s.label)}</div><div class="kpi-sub">${formatPct(n / total)}</div></article>`;
      }).join("");

      const matrixHead = CRITICALITY.map((t) => `<th>${esc(t)}</th>`).join("") + "<th>Total</th>";
      const matrixRows = DATA.waves.map((w) => {
        const cells = CRITICALITY.map((tier) => {
          const cellCohorts = DATA.cohorts.filter((c) => c.wave === w.id && c.criticality === tier);
          const pop = sumBy(cellCohorts, cohortTotal);
          const on = sumBy(cellCohorts, cohortOnNexus);
          const title = pop ? `${formatPct(on / pop)} on Nexus` : "None";
          const bg = pop ? tint(w.color, on / pop) : "transparent";
          const body = pop ? `${formatInt(pop)}<div class="cell-sub">${formatPct(on / pop)}</div>` : "0";
          return `<td class="cell" style="background:${bg}" title="${title}">${body}</td>`;
        }).join("");
        const rowPop = wavePopulation(w.id);
        const rowOn = waveOnNexus(w.id);
        const totalCell = `<td class="cell"><strong>${formatInt(rowPop)}</strong><div class="cell-sub">${formatPct(rowOn / rowPop)}</div></td>`;
        return `<tr><th><span class="dot" style="background:${w.color}"></span>${esc(w.shortName)}</th>${cells}${totalCell}</tr>`;
      }).join("");
      const totalCells = CRITICALITY.map((tier) => {
        const cellCohorts = DATA.cohorts.filter((c) => c.criticality === tier);
        const pop = sumBy(cellCohorts, cohortTotal);
        const on = sumBy(cellCohorts, cohortOnNexus);
        return `<td class="cell"><strong>${formatInt(pop)}</strong><div class="cell-sub">${pop ? formatPct(on / pop) : "0%"}</div></td>`;
      }).join("");
      const grandPop = sumBy(DATA.cohorts, cohortTotal);
      const grandOn = sumBy(DATA.cohorts, cohortOnNexus);
      const matrixFoot = `<tr class="wave-head"><th>Total</th>${totalCells}<td class="cell"><strong>${formatInt(grandPop)}</strong><div class="cell-sub">${formatPct(grandOn / grandPop)}</div></td></tr>`;

      const tableRows = DATA.waves.map((w) => {
        const head = `<tr class="wave-head"><td colspan="9"><span class="dot" style="background:${w.color}"></span>${esc(w.name)} · ${formatInt(wavePopulation(w.id))} identities</td></tr>`;
        const rows = waveCohorts(w.id).map((c) => {
          const pop = cohortTotal(c);
          const on = cohortOnNexus(c);
          return `<tr class="cohort-row" data-cohort="${c.id}">
            <td class="mono">${esc(c.id)}</td>
            <td>${esc(c.department)}</td>
            <td>${esc(c.region)}</td>
            <td>${pill(c.criticality, CRITICALITY_COLOR[c.criticality])}</td>
            <td>${pill(c.privilege, PRIVILEGE_COLOR[c.privilege])}</td>
            <td>${formatInt(pop)}</td>
            <td>${formatInt(on)} · ${formatPct(on / pop)}</td>
            <td${c.blocked ? ' class="blocked"' : ""}>${formatInt(c.blocked)}</td>
            <td class="mono muted">${c.notStarted}/${c.ready}/${c.scheduled}/${c.migrated}/${c.verified}/${c.legacyDisabled}</td>
          </tr>`;
        }).join("");
        return head + rows;
      }).join("");

      document.getElementById("panel-identities").innerHTML = `
        <div class="funnel-grid">${stageCards}</div>
        <div class="card" style="margin-bottom:12px">
          <h2>Migration funnel</h2>
          <div class="chart-box"><canvas id="funnel-chart" aria-label="Bar chart of migration funnel stages"></canvas></div>
        </div>
        <div class="card" style="margin-bottom:12px">
          <h2>Wave × criticality</h2>
          <table class="matrix">
            <thead><tr><th>Wave</th>${matrixHead}</tr></thead>
            <tbody>${matrixRows}${matrixFoot}</tbody>
          </table>
        </div>
        <div class="card">
          <h2>Cohort register</h2>
          <p class="muted" style="margin-top:0;font-size:12px">Funnel counts: NS / R / S / M / V / LD</p>
          <div style="overflow-x:auto">
            <table>
              <thead><tr>
                <th>ID</th><th>Department</th><th>Region</th><th>Criticality</th><th>Privilege</th>
                <th>Population</th><th>On Nexus</th><th>Blocked</th><th>Funnel</th>
              </tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>`;

      document.getElementById("panel-identities").querySelectorAll("[data-cohort]").forEach((row) => {
        row.addEventListener("click", () => openCohort(row.dataset.cohort));
      });
    }

    function chartUnavailable(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return true;
      if (typeof Chart === "undefined") {
        canvas.parentElement.innerHTML = `<p class="muted" style="margin:40px 0;text-align:center">Chart unavailable offline — data in cards above</p>`;
        return true;
      }
      return false;
    }

    function initFunnelChart() {
      const ctx = document.getElementById("funnel-chart");
      if (!ctx || funnelChart) return;
      if (chartUnavailable("funnel-chart")) return;
      funnelChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: FUNNEL_STAGES.map((s) => s.label),
          datasets: [{
            data: FUNNEL_STAGES.map((s) => sumBy(DATA.cohorts, (c) => c[s.key])),
            backgroundColor: FUNNEL_STAGES.map((s) => s.color),
            borderWidth: 0
          }]
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { color: "#5C6B80" }, grid: { color: "rgba(12,27,48,0.08)" } }, x: { ticks: { color: "#0C1B30" }, grid: { display: false } } }
        }
      });
    }

    function renderApplications() {
      const on = DATA.applications.filter(appOnNexus).length;
      const dual = DATA.applications.filter((a) => a.status === "In Dual-Run").length;
      const ns = DATA.applications.filter((a) => a.status === "Not Started").length;
      const def = DATA.applications.filter((a) => a.status === "Deferred").length;
      const sox = DATA.applications.filter((a) => a.sox).length;
      const groups = [0, 1, 2, 3].map((tier) => {
        const apps = DATA.applications.filter((a) => a.tier === tier);
        const rows = apps.map((a) => {
          const w = waveMeta(a.wave);
          return `<div class="app-row">
            <div class="row-flex">
              <div class="grow"><strong>${esc(a.name)}</strong> <span class="mono muted">${esc(a.id)}</span></div>
              ${pill(a.protocol, PROTOCOL_COLOR[a.protocol])}
              ${pill(w.shortName, w.color)}
              ${pill(a.status, APP_STATUS_COLOR[a.status])}

              <span class="muted" style="font-size:12px">${esc(a.owner)}</span>
            </div>
          </div>`;

        return `<h3 class="tier-h">Tier ${tier} · ${apps.length} · ${esc(TIER_HINT[tier])}</h3>${rows}`;
      }).join("");

      document.getElementById("panel-applications").innerHTML = `
        <div class="kpi-grid">
          ${kpiCard(String(on), "Cut over (on Nexus)", "Cut Over + Verified")}
          ${kpiCard(String(dual), "In dual-run", "Still on both platforms")}
          ${kpiCard(String(ns), "Not started", "Awaiting wave")}
          ${kpiCard(String(def), "Deferred", "Out of current path")}
        </div>
        <p class="legend">${sox} SOX-relevant applications in the register.</p>
        <div class="two-col">
          <div class="card">${groups}</div>
          <div class="card">
            <h2>Cutover mix</h2>
            <div class="chart-box"><canvas id="app-chart" aria-label="Doughnut chart of application cutover status"></canvas></div>
          </div>
        </div>`;
    }

    function initAppChart() {
      const ctx = document.getElementById("app-chart");
      if (!ctx || appChart) return;
      if (chartUnavailable("app-chart")) return;
      const statuses = ["Verified", "Cut Over", "In Dual-Run", "Deferred", "Not Started"];
      const centerPlugin = {
        id: "centerText",
        afterDraw(chart) {
          const { ctx: c, chartArea } = chart;
          c.save();
          c.fillStyle = "#0C1B30";
          c.font = "700 22px Segoe UI, sans-serif";
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText(String(DATA.applications.length), (chartArea.left + chartArea.right) / 2, (chartArea.top + chartArea.bottom) / 2);
          c.restore();
        }
      };
      appChart = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: statuses,
          datasets: [{
            data: statuses.map((s) => DATA.applications.filter((a) => a.status === s).length),
            backgroundColor: statuses.map((s) => APP_STATUS_COLOR[s]),
            borderWidth: 0
          }]
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          cutout: "62%",
          plugins: { legend: { position: "bottom", labels: { color: "#0C1B30", boxWidth: 12 } } }
        },
        plugins: [centerPlugin]
      });
    }

    function renderRisks() {
      const open = DATA.risks.filter((r) => r.status === "Open").length;
      const mit = DATA.risks.filter((r) => r.status === "Mitigating").length;
      const hi = DATA.risks.filter((r) => r.severity === "Critical" || r.severity === "High").length;
      const decisions = DATA.risks.filter((r) => r.decisionNeeded).map((r) => `
        <div class="decision">
          <div class="row-flex"><span class="mono">${esc(r.id)}</span> ${pill(r.severity, SEVERITY_COLOR[r.severity])}</div>
          <strong>${esc(r.headline)}</strong>
          <p style="margin:6px 0">${esc(r.decision)}</p>
          <p class="muted" style="margin:0;font-size:12px">${esc(r.owner)} · ${formatDate(r.due)}</p>
        </div>`).join("");

      const rdy = DATA.readiness.map((item) => {
        const rag = readinessRag(item);
        const color = item.percent >= item.target ? "#C29A45" : RAG_COLOR[rag];
        return `<div class="rdy">
          <div class="row-flex"><strong class="grow">${esc(item.name)}</strong><span class="muted">${esc(item.owner)}</span></div>
          <div class="progress-track" style="margin:6px 0"><div class="progress-fill" style="width:${item.percent}%;background:${color}"></div></div>
          <div class="muted" style="font-size:12px">${item.percent}% of ${item.target}%</div>
        </div>`;
      }).join("");

      const grouped = ["Critical", "High", "Medium", "Low"].map((sev) => {
        const items = DATA.risks.filter((r) => r.severity === sev);
        if (!items.length) return "";
        const rows = items.map((r) => {
          const overdue = r.due < DATA.meta.today && r.status === "Open";
          return `<div class="risk-row">
            <div class="row-flex">
              <span class="mono">${esc(r.id)}</span>
              ${pill(waveMeta(r.wave).shortName, waveMeta(r.wave).color)}
              ${pill(r.severity, SEVERITY_COLOR[r.severity])}
              ${pill(r.status, RISK_STATUS_COLOR[r.status])}
              <span class="rag-pip" role="img" aria-label="Status: ${r.rag.toLowerCase()}" style="background:${RAG_COLOR[r.rag.toLowerCase()]}"></span>
            </div>
            <strong>${esc(r.headline)}</strong>
            <p class="muted" style="margin:4px 0 6px">${esc(r.description)}</p>
            <p style="margin:0;font-size:12px" class="${overdue ? "blocked" : "muted"}">${esc(r.owner)} · ${formatDate(r.due)}</p>
          </div>`;
        }).join("");
        return `<h3 class="tier-h">${esc(sev)}</h3>${rows}`;
      }).join("");

      const aug = DATA.decommissionBurndown.find((x) => x.month === "2026-08");
      const total = sumBy(DATA.cohorts, cohortTotal);
      const remain = total - sumBy(DATA.cohorts, (c) => c.legacyDisabled);

      document.getElementById("panel-risks").innerHTML = `
        <div class="kpi-grid">
          ${kpiCard(String(DATA.risks.length), "Total risks", "Open program register")}
          ${kpiCard(String(open), "Open", "Need a decision or action", true)}
          ${kpiCard(String(mit), "Mitigating", "Treatment underway")}
          ${kpiCard(String(hi), "Critical + High", "Watch for Wave 1–3 gates")}
        </div>
        <div class="card" style="margin-bottom:12px">
          <h2>Decisions needed</h2>
          ${decisions}
        </div>
        <div class="two-col">
          <div class="card">
            <h2>Readiness coverage</h2>
            ${rdy}
          </div>
          <div class="card">
            <h2>LegacyID accounts still active</h2>
            <div class="chart-box tall"><canvas id="burn-chart" aria-label="Line chart of LegacyID accounts still active"></canvas></div>
            <p class="muted" style="font-size:12px;margin:8px 0 0">August actual ${formatInt(aug.actualRemaining)} must equal identities not yet legacy-disabled (${formatInt(remain)}).</p>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <h2>Risk register</h2>
          ${grouped}
        </div>`;
    }

    function initBurnChart() {
      const ctx = document.getElementById("burn-chart");
      if (!ctx || burnChart) return;
      if (chartUnavailable("burn-chart")) return;
      burnChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: DATA.decommissionBurndown.map((d) => d.label),
          datasets: [
            {
              label: "Actual remaining",
              data: DATA.decommissionBurndown.map((d) => d.actualRemaining),
              borderColor: "#C29A45",
              backgroundColor: "rgba(194,154,69,0.15)",
              spanGaps: false,
              tension: 0.2,
              pointRadius: 4
            },
            {
              label: "Forecast remaining",
              data: DATA.decommissionBurndown.map((d) => d.forecastRemaining),
              borderColor: "#1F3A5F",
              borderDash: [6, 4],
              tension: 0.2,
              pointRadius: 3,
              fill: false
            }
          ]
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#0C1B30" } } },
          scales: {
            y: { beginAtZero: true, ticks: { color: "#5C6B80" }, grid: { color: "rgba(12,27,48,0.08)" } },
            x: { ticks: { color: "#0C1B30" }, grid: { display: false } }
          }
        }
      });
    }

    const charts = { identities: initFunnelChart, applications: initAppChart, risks: initBurnChart };
    const TAB_ORDER = ["overview", "waves", "identities", "applications", "risks"];
    let popoverReturnFocus = null;

    function showTab(name) {
      TAB_ORDER.forEach((t) => {
        const panel = document.getElementById("panel-" + t);
        const tab = document.getElementById("tab-" + t);
        const on = t === name;
        panel.classList.toggle("active", on);
        panel.hidden = !on;
        tab.setAttribute("aria-selected", on ? "true" : "false");
        tab.tabIndex = on ? 0 : -1;
      });
      if (charts[name]) {
        requestAnimationFrame(() => charts[name]());
      }
    }

    function onTabKeydown(e) {
      const i = TAB_ORDER.indexOf(e.currentTarget.id.replace("tab-", ""));
      if (i < 0) return;
      let next = i;
      if (e.key === "ArrowRight") next = (i + 1) % TAB_ORDER.length;
      else if (e.key === "ArrowLeft") next = (i - 1 + TAB_ORDER.length) % TAB_ORDER.length;
      else return;
      e.preventDefault();
      showTab(TAB_ORDER[next]);
      document.getElementById("tab-" + TAB_ORDER[next]).focus();
    }

    function openPopover(html) {
      popoverReturnFocus = document.activeElement;
      document.getElementById("popover-body").innerHTML = html;
      const root = document.getElementById("popover");
      root.classList.add("open");
      document.getElementById("popover-close").focus();
    }
    function closePopover() {
      document.getElementById("popover").classList.remove("open");
      if (popoverReturnFocus && typeof popoverReturnFocus.focus === "function") {
        popoverReturnFocus.focus();
      }
      popoverReturnFocus = null;
    }
    function trapPopoverFocus(e) {
      if (e.key !== "Tab") return;
      const root = document.getElementById("popover");
      if (!root.classList.contains("open")) return;
      const focusable = document.getElementById("popover-card").querySelectorAll(
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
      );
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }

    function boot() {
      assertData();
      document.getElementById("header-sub").textContent =
        `${DATA.meta.company} · ${DATA.meta.sourcePlatform} → ${DATA.meta.targetPlatform}`;
      document.getElementById("header-asof").textContent =
        `${formatDate(DATA.meta.windowStart)} – ${formatDate(DATA.meta.windowEnd)} · As of ${formatDate(DATA.meta.today)} · ${DATA.meta.owner}`;
      document.getElementById("disclaimer").textContent = DATA.meta.disclaimer;

      renderOverview();
      renderWaves();
      renderIdentities();
      renderApplications();
      renderRisks();

      document.querySelectorAll(".tablist [role=tab]").forEach((btn) => {
        btn.addEventListener("click", () => showTab(btn.id.replace("tab-", "")));
        btn.addEventListener("keydown", onTabKeydown);
      });
      document.getElementById("popover-close").addEventListener("click", closePopover);
      document.getElementById("popover").addEventListener("click", (e) => {
        if (e.target.id === "popover") closePopover();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePopover();
        trapPopoverFocus(e);
      });
      showTab("overview");
    }

    boot();
  </script>
</body>
</html>
